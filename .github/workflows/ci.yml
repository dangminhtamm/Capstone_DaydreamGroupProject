name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_brain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d second_brain_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_brain_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/second_brain_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @second-brain/db prisma:generate

      - name: Migrate blank PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Verify migrated schema matches Prisma
        run: pnpm --filter @second-brain/db prisma:migrate:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: AI memory smoke evaluation
        run: pnpm run ci:memory-eval

      - name: Audit runtime dependencies
        run: pnpm run audit
