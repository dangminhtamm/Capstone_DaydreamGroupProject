services:
  # ─── NestJS API ───
  - type: web
    name: daydreamer-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: |
      npx -y pnpm@10.33.0 install --frozen-lockfile &&
      npx -y pnpm@10.33.0 --filter @second-brain/db prisma:generate &&
      npx -y pnpm@10.33.0 --filter @second-brain/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_AUTO_PIN
        value: "0"
      # ── Supabase ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # ── Database ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # ── Google OAuth ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # ── AI / Gemini ──
      - key: TUTURUUU_AI_API_KEY
        sync: false
      - key: TUTURUUU_EMBEDDING_MODEL
        value: google/gemini-embedding-2
      - key: GEMINI_CHUNK_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_ANSWER_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_SUMMARY_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: ADMIN_EMAILS
        sync: false
      # ── CORS (set after Vercel deploy) ──
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # ── Auth keys ──
      - key: SECRET_KEY
        sync: false
      - key: PUBLISHABLE_KEY
        sync: false

  # ─── Background Worker ───
  - type: worker
    name: daydreamer-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: |
      npx -y pnpm@10.33.0 install --frozen-lockfile &&
      npx -y pnpm@10.33.0 --filter @second-brain/db prisma:generate &&
      npx -y pnpm@10.33.0 --filter @second-brain/worker build
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_AUTO_PIN
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TUTURUUU_AI_API_KEY
        sync: false
      - key: TUTURUUU_EMBEDDING_MODEL
        value: google/gemini-embedding-2
      - key: GEMINI_CHUNK_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_ANSWER_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_SUMMARY_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: ADMIN_EMAILS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PUBLISHABLE_KEY
        sync: false
